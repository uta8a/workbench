name: Linear Tools CI

on:
  push:
    paths:
      - 'linear-tools/**'
      - '.github/workflows/linear-tools.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'linear-tools/**'
      - '.github/workflows/linear-tools.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install dependencies
        run: |
          cd linear-tools
          pnpm install --frozen-lockfile
      - name: Type check
        run: |
          cd linear-tools
          pnpm typecheck
      - name: Test
        run: |
          cd linear-tools
          pnpm test
